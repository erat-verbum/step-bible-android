name: Build Release APK

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Parse release tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          DEB=$(echo "$TAG" | grep -oP '^\d+\.\d+\.\d+')
          echo "deb_version=$DEB" >> $GITHUB_OUTPUT
          DEB_US=$(echo "$DEB" | tr '.' '_')
          echo "deb_underscore=$DEB_US" >> $GITHUB_OUTPUT
          echo "android_patch=${TAG##*.}" >> $GITHUB_OUTPUT
          echo "STEP_DEB_URL=https://dev.stepbible.org/downloads/stepbible_${DEB_US}.deb" >> $GITHUB_ENV

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: |
            build-cache
            .build-vars
            .extracted
          key: build-cache-${{ hashFiles('build.sh') }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Download assets
        run: bash build.sh download

      - name: Extract assets
        run: bash build.sh extract

      - name: Build release APK
        run: bash build.sh build release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: STEP Bible ${{ steps.tag.outputs.deb_version }} (Release ${{ steps.tag.outputs.android_patch }})
          body: |
            Android release for STEP Bible ${{ steps.tag.outputs.deb_version }}
            
            **Features:**
            - Multi-reference Bible extraction from shared text
            - Support for semicolon-separated references within single passages
            - Signed APKs for distribution
            
            **Technical Details:**
            - arm64-v8a and x86_64 APK architectures
            - Debian package: stepbible_${{ steps.tag.outputs.deb_underscore }}.deb
          files: |
            app/build/outputs/apk/release/*.apk
